name: Build iOS app

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Optional bundle identifier override (leave blank for com.zzr.coursenavigator.mobile)"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
      - master
    paths:
      - "ios/**"
      - "scripts/build-ios-ipa.sh"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Course Navigator (unsigned IPA)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/CourseNavigatorMobile.xcodeproj \
            -scheme CourseNavigatorMobile \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Build unsigned IPA
        env:
          COURSE_NAVIGATOR_IOS_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: bash scripts/build-ios-ipa.sh

      - name: Summarize artifact
        run: |
          IPA_PATH="dist/ios/CourseNavigatorMobile-unsigned.ipa"
          {
            echo "### Course Navigator iOS build"
            echo
            echo "- IPA: \`$IPA_PATH\`"
            echo "- Size: $(du -h "$IPA_PATH" | awk '{print $1}')"
            echo "- SHA256: \`$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')\`"
            echo
            echo "The IPA is unsigned. Sign it with your Apple development identity before installing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CourseNavigatorMobile-unsigned-ipa
          path: dist/ios/CourseNavigatorMobile-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
